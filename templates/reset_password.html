<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>パスワード再設定 · 架空読書会</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 본문 화면과 같은 서체 한 벌 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=33">
  <link rel="stylesheet" href="/static/css/mobile.css?v=14">
  <style>
    .rp-wrap { max-width: 420px; margin: 80px auto; padding: 32px 28px; border: 1px solid #e4ded2; border-radius: 12px; font-family: var(--serif); }
    .rp-wrap h1 { font-size: 20px; margin: 0 0 8px; }
    .rp-wrap p.desc { font-size: 13.5px; color: #6b6255; line-height: 1.7; margin: 0 0 20px; }
    .rp-wrap label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
    .rp-wrap input { width: 100%; padding: 11px 12px; border: 1px solid #d9d2c4; border-radius: 7px; font-size: 14px; box-sizing: border-box; }
    .rp-wrap button { width: 100%; margin-top: 20px; padding: 12px; border: 0; border-radius: 7px; background: #8b4f25; color: #fff; font-size: 14.5px; font-weight: 700; cursor: pointer; }
    .rp-wrap button[disabled] { opacity: .6; cursor: default; }
    .rp-msg { margin-top: 16px; font-size: 13.5px; line-height: 1.6; min-height: 20px; }
    .rp-msg.err { color: #b54a6a; }
    .rp-msg.ok { color: #2d7a50; }

    /* 모바일: 화면 폭에 맞춰 여백을 줄이고, 입력창 글자는 16px 이상으로 유지한다
       (iOS 사파리는 16px 미만 입력창에 포커스하면 화면을 자동 확대한다) */
    @media (max-width: 640px) {
      .rp-wrap { margin: 32px 12px; padding: 26px 20px; }
      .rp-wrap h1 { font-size: 19px; }
      .rp-wrap input { font-size: 16px; padding: 12px; }
      .rp-wrap button { padding: 14px; font-size: 15px; }
    }
</style>
</head>

<body>
  <div class="rp-wrap">
    <h1>パスワード再設定</h1>
    <p class="desc">新しいパスワードを入力してください。このリンクは一度だけ使えます。変更後は、ログイン中のすべての端末で再度ログインが必要になります。</p>

    <form id="rp-form" autocomplete="off">
      <label for="rp-pw">新しいパスワード（8文字以上）</label>
      <input type="password" id="rp-pw" minlength="8" required autocomplete="new-password">

      <label for="rp-pw2">新しいパスワード（確認）</label>
      <input type="password" id="rp-pw2" minlength="8" required autocomplete="new-password">

      <button type="submit" id="rp-submit">パスワードを変更</button>
    </form>

    <div class="rp-msg" id="rp-msg"></div>
  </div>

  <script>
    (function () {
      // 토큰은 주소창의 쿼리스트링에서만 읽고, 화면이나 로그에는 노출하지 않는다.
      var token = new URLSearchParams(window.location.search).get('token') || '';
      var form = document.getElementById('rp-form');
      var msg = document.getElementById('rp-msg');
      var btn = document.getElementById('rp-submit');

      function show(text, kind) {
        msg.textContent = text;            // textContent: HTML 주입 여지를 남기지 않는다
        msg.className = 'rp-msg ' + (kind || '');
      }

      if (!token) {
        show('再設定リンクが正しくありません。お手数ですが、もう一度お申し込みください。', 'err');
        btn.disabled = true;
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        var pw = document.getElementById('rp-pw').value;
        var pw2 = document.getElementById('rp-pw2').value;

        if (pw.length < 8) { show('パスワードは8文字以上で入力してください。', 'err'); return; }
        if (pw !== pw2) { show('パスワードが一致しません。', 'err'); return; }

        btn.disabled = true;
        show('変更しています…');
        try {
          var res = await fetch('/api/auth/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token, new_password: pw })
          });
          var data = await res.json();
          if (res.ok) {
            show(data.message || 'パスワードを変更しました。', 'ok');
            form.style.display = 'none';
            setTimeout(function () { window.location.href = '/'; }, 2500);
          } else {
            show(data.detail || '変更できませんでした。リンクをもう一度お申し込みください。', 'err');
            btn.disabled = false;
          }
        } catch (err) {
          show('通信エラーが発生しました。しばらくしてからもう一度お試しください。', 'err');
          btn.disabled = false;
        }
      });
    })();
  </script>
</body>

</html>
