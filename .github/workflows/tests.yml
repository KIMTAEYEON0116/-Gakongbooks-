# 회귀 테스트를 밀 때마다 돌린다.
#
# 네 개의 테스트는 각각 한 번 실제로 겪은 사고를 고정한 것이다.
# 남의 후보를 채택할 수 있었던 일, 답글이 있는 메시지를 지우면 답글까지
# 사라지던 일, 반응 수를 조작할 수 있었던 일, 채팅 도배를 막지 못하던 일이다.
# 같은 일이 다시 들어오지 않게 자동으로 확인한다.
#
# 테스트는 메모리 SQLite를 끼워 넣고 돌기 때문에 DB나 API 키가 필요 없다.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 문법 확인
        run: python -m compileall -q main.py auth.py models.py config.py i18n.py database.py security.py

      - name: 회귀 테스트
        run: |
          failed=0
          for f in tests/test_*.py; do
            echo "── $f"
            python "$f" || failed=1
          done
          exit $failed
